services:
  square-harness:
    build:
      context: .
      dockerfile: Dockerfile
    image: square-harness:local
    environment:
      SQUARE_HARNESS_MODE: ${SQUARE_HARNESS_MODE:-local}
      SQUARE_HARNESS_CONTAINER: "1"
      SQUARE_DATA_DIR: /data/local
      SQUARE_SERVER_DATA_ROOT: /data/server
    ports:
      - "127.0.0.1:${SQUARE_GUI_PORT:-8765}:8765"
    volumes:
      - square-data:/data
    tmpfs:
      - /run/square-harness:rw,noexec,nosuid,size=1m,mode=0700,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8765), timeout=2).close()"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  square-data:
    name: ${SQUARE_DATA_VOLUME:-square-harness-local-data}
