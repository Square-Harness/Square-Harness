name: Publish app container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Test tag (must match mathagent/__init__.py or use a matching test version)"
        required: true
        default: "v0.5.0"

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'Square-Harness/Square-Harness' && (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || github.event.release.tag_name }}

      - name: Verify release tag matches app version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          tag_match = re.fullmatch(r"v?(\d+\.\d+\.\d+)", tag)
          source = Path("mathagent/__init__.py").read_text(encoding="utf-8")
          version_match = re.search(r"^__version__ = ['\"]([^'\"]+)['\"]", source, re.MULTILINE)
          if not tag_match or not version_match:
              sys.exit("Release tag must be a stable semantic version such as v1.2.3.")
          if tag_match.group(1) != version_match.group(1):
              sys.exit(
                  f"Release tag {tag!r} does not match app version "
                  f"{version_match.group(1)!r}."
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version_match.group(1)}\n")
          print(f"Publishing Square Harness {version_match.group(1)}")
          PY

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/square-harness/square-harness
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Assemble source-free Docker download
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/square-harness-docker"
          assets="$RUNNER_TEMP/square-harness-release-assets"
          mkdir -p "$bundle/deployment" "$assets"

          cp compose.yaml "$bundle/compose.yaml"
          cp -p deployment/start-local.sh deployment/start-local.ps1 "$bundle/deployment/"
          cp deployment/release/README.md "$bundle/README.md"
          cat > "$bundle/deployment/compose.local.env.example" <<EOF
          SQUARE_HARNESS_MODE=local
          SQUARE_GUI_PORT=8765
          SQUARE_DATA_VOLUME=square-harness-local-data
          SQUARE_HARNESS_IMAGE=ghcr.io/square-harness/square-harness:${APP_VERSION}
          EOF

          zip_path="$assets/square-harness-${APP_VERSION}-docker.zip"
          (cd "$bundle" && zip -qr "$zip_path" compose.yaml deployment README.md)
          cp "$bundle/README.md" "$assets/square-harness-${APP_VERSION}-docker-README.md"

          # gh release upload "$RELEASE_TAG" \
          #   "$zip_path" \
          #   "$assets/square-harness-${APP_VERSION}-docker-README.md" \
          #   --clobber
        
      - name: Upload test Docker bundle
        uses: actions/upload-artifact@v4
        with:
          name: square-harness-docker-test
          path: ${{ runner.temp }}/square-harness-release-assets/*

