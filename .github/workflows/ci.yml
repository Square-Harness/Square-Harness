name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and PDF support
        run: python -m pip install '.[research]'
      - name: Test with simulated models and local HTTP servers
        run: python -m unittest discover -s tests -v
      - name: Build and check release distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke test the installed wheel outside the source tree
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/square-harness" --help
          "$RUNNER_TEMP/wheel-smoke/bin/mathagent" --help
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I - <<'PY'
          from importlib.resources import files
          from importlib.metadata import distribution
          for skill in ('check', 'explain', 'literature', 'referee', 'review', 'review-quick', 'writeup',
                        'python-lab', 'numerical-sanity-check', 'style', 'summarize'):
              resource = files('mathagent').joinpath('skills', skill, 'SKILL.md')
              assert resource.read_text(encoding='utf-8').strip(), skill
          print('All bundled skills are present in the installed wheel.')
          assert files('mathagent').joinpath('numerics', 'docker', 'requirements.lock').is_file()
          static = files('mathagent').joinpath('gui', 'static')
          for name in ('index.html', 'manifest.webmanifest', 'THIRD-PARTY-NOTICES.txt',
                       'LICENSE.txt', 'LICENSE-APACHE-2.0.txt', 'NOTICE.txt'):
              assert static.joinpath(name).is_file(), name
          assert any(item.name.endswith('.js') for item in static.joinpath('assets').iterdir())
          print('The visual interface is present in the installed wheel.')
          dist = distribution('square-harness')
          assert dist.metadata['License-Expression'] == 'PolyForm-Noncommercial-1.0.0 AND Apache-2.0'
          docker = files('mathagent').joinpath('numerics', 'docker')
          for name in ('LICENSE.md', 'LICENSE-APACHE-2.0', 'NOTICE'):
              installed = next(path for path in dist.files if str(path).endswith('.dist-info/licenses/' + name))
              assert dist.locate_file(installed).read_bytes() == docker.joinpath(name).read_bytes(), name
          print('Both licenses and notices are present in the wheel and Docker build context.')
          PY

  interface:
    name: Interface build matches its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Type-check, test and build the interface
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Committed assets in mathagent/gui/static are up to date
        run: git status --porcelain -- mathagent/gui/static && git diff --exit-code -- mathagent/gui/static && test -z "$(git status --porcelain -- mathagent/gui/static)"

  sandbox:
    name: Python sandbox (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install '.[research]'
      - name: Build the pinned sandbox image
        run: python -m mathagent.numerics build
      - name: Check Docker, the image and a tiny run
        run: python -m mathagent.numerics doctor
      - name: Sandbox tests in real containers
        run: python -m unittest -v tests.test_python_sandbox
      - name: No sandbox container is left behind
        run: test -z "$(docker ps --all --quiet --filter label=org.squareharness.sandbox.run)"
